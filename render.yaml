services:
  - type: web
    name: flowboard-realtime-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run server
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGINS
        value: https://flowboard-plum.vercel.app
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: MONGO_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
